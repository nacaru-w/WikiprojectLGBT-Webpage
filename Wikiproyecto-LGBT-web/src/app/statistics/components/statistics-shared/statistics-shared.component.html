<nav class="subpage-nav">
    <li class="subpage-nav-option" routerLinkActive="active">
        <a routerLink="articles" [replaceUrl]="true">{{ 'stats.nav.articles' | translate }}</a>
    </li>
    <li class="subpage-nav-option" routerLinkActive="active">
        <a routerLink="participants" [replaceUrl]="true">{{ 'stats.nav.participants' | translate }}</a>
    </li>
    <li class="subpage-nav-option" routerLinkActive="active">
        <a routerLink="images" [replaceUrl]="true">{{ 'stats.nav.images' | translate }}</a>
    </li>
</nav>
<div class="chart-box">
    <!-- Intro + empty-state are the landing content: shown only once hydrated and
         no section is active. Gating on showEmptyState (browser-only) instead of
         "no active route" keeps the intro from server-rendering on a deep link
         like /stats/participants and then being removed — which caused a flash. -->
    @if (showEmptyState) {
        <div class="stats-introduction">
            <p [innerHTML]="'stats.intro1' | translate"></p>
            <p>{{ 'stats.intro2' | translate }}</p>
        </div>
        <div class="stats-placeholder">
            <img class="placeholder-barba" src="assets/imgs/Barbas/editor/barba_editor_{{barba}}.svg" alt="">
            <p class="placeholder-label">{{ 'stats.pickSection' | translate }}</p>
        </div>
    }
    <!-- Gated on hydration so the section's charts never server-render (a hash-free
         deep link reaches the server; without this gate it would try to render the
         chart, mismatch on hydration and leave a stuck barba). -->
    @if (showOutlet) {
        <router-outlet (activate)="onOutletActivate()" (deactivate)="onOutletDeactivate()"></router-outlet>
    }
</div>
